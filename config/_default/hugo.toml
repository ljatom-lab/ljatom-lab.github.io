# -- Site Configuration --

theme = "congo"
baseURL = "https://hualing.me/"
defaultContentLanguage = "zh-Hans"

enableRobotsTXT = true
summaryLength = 50

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[privacy]
  [privacy.vimeo]
    enableDNT = true
  [privacy.x]
    enableDNT = true
  [privacy.youTube]
    privacyEnhanced = true

[services]
  [services.x]
    disableInlineCSS = true
